# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0 &',
    # 'exec-and-forget sketchybar &',
    'exec-and-forget alacritty --config-file $HOME/.config/alacritty/alacritty-scratchpad.toml --title Scratchpad',
    'exec-and-forget alacritty',
    'exec-and-forget /Applications/Emacs.app/Contents/MacOS/Emacs'
]


# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
#on-focused-changed = ['move-mouse monitor-lazy-center']

# exec-on-workspace-change = ['/bin/bash', '-c',
#     'sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE &'
# ]

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors


[workspace-to-monitor-force-assignment]
1 = 1                            # Monitor sequence number from left to right. 1-based indexing
2 = 2
3 = 2
4 = ['built-in', 1]
5 = 2
6 = 2
7 = 2
8 = 1
9 = ['built-in']
10 = 2
A = ['built-in']
B = ['built-in']
# 2 = 'main'                       # Main monitor
# 3 = 'secondary'                  # Non-main monitor in case when there are only two monitors
# 4 = 'built-in'                   # Case insensitive regex substring
# 5 = '^built-in retina display$'  # Case insensitive regex match
# 6 = ['secondary', 'dell']        # You can specify multiple patterns. The first matching pattern will be used

[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       0
outer.bottom =     0
outer.top =        0
outer.right =      0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

cmd-alt-h = [] # Disable "hide others"

# cmd-enter = '''exec-and-forget osascript -e '
# tell application "Alacritty"
# do script
# activate
# end tell'
# '''

# i3 wraps focus by default
# cmd-h =         'focus --boundaries-action wrap-around-the-workspace left'
# cmd-j =         'focus --boundaries-action wrap-around-the-workspace down'
# # cmd-k =         'focus --boundaries-action wrap-around-the-workspace up'
# cmd-l = 'focus --boundaries-action wrap-around-the-workspace right'
cmd-h = 'focus-monitor 1'
cmd-l = 'focus-monitor 2'
cmd-j = 'focus-monitor "Built-in"'
alt-h = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
alt-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
# cmd-k = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
alt-l = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'

cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# Consider using 'join-with' command as a 'split' replacement if you want to enable normalizations
# alt-b = 'split horizontal'
# alt-v = 'split vertical'

alt-f = 'fullscreen'

alt-s = 'layout v_accordion' # 'layout stacking' in i3
alt-w = 'layout h_accordion' # 'layout tabbed' in i3
alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
#alt-space = 'focus toggle_tiling_floating'

# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-backtick = 'workspace A'
alt-1 = 'workspace 6'
alt-ctrl-2 = 'workspace 7'
alt-ctrl-3 = 'workspace 8'
alt-ctrl-4 = 'workspace 9'
alt-ctrl-5 = 'workspace 10'
alt-backtick = 'workspace B'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-backtick = 'move-node-to-workspace A'
alt-shift-1 = 'move-node-to-workspace 6'
alt-ctrl-shift-2 = 'move-node-to-workspace 7'
alt-ctrl-shift-3 = 'move-node-to-workspace 8'
alt-ctrl-shift-4 = 'move-node-to-workspace 9'
alt-ctrl-shift-5 = 'move-node-to-workspace 10'
alt-shift-backtick = 'move-node-to-workspace B'

alt-shift-c = ['''exec-and-forget osascript -e 'display notification "Aerospace config reloaded !" with title "Aerospace"' ''', 'reload-config']
# alt-t = '''exec-and-forget osascript -e 'display notification "Aerospace config reloaded !" with title "Aerospace"' '''
# alt-y = '''exec-and-forget echo -n "black" | nc -4u -w0 localhost 1738'''
# alt-u = '''exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738'''
# alt-i = '''exec-and-forget echo -n "red" | nc -4u -w0 localhost 1738'''

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
cmd-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'


# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-r = 'mode resize'
alt-q = ['mode media', 'exec-and-forget echo -n "green" | nc -4u -w0 localhost 1738']
cmd-shift-semicolon = ['mode service', 'exec-and-forget echo -n "red" | nc -4u -w0 localhost 1738']
cmd-alt-d = ['mode launch', 'exec-and-forget echo -n "blue" | nc -4u -w0 localhost 1738']

cmd-ctrl-s = 'exec-and-forget ~/bin/scratchpad.sh Obsidian'
cmd-ctrl-q = 'exec-and-forget ~/bin/scratchpad.sh alacritty Scratchpad'
cmd-ctrl-e = 'exec-and-forget ~/bin/scratchpad.sh Emacs'
cmd-ctrl-r = 'exec-and-forget ~/bin/scratchpad.sh KeePassXC'
cmd-ctrl-w = 'exec-and-forget ~/bin/scratchpad.sh zoom.us'
# cmd-ctrl-w = "exec-and-forget ~/bin/focusZoomAerospace.sh"


[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

[mode.launch.binding]

# c = ['''exec-and-forget ~/bin/open_chrome_osascript.sh''', 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
c = ['''exec-and-forget open -na 'Google Chrome' --args --profile-directory="Profile 1" ''', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
shift-c = ['''exec-and-forget open -na 'Google Chrome' --args --profile-directory="Profile 2" ''', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
j = ['''exec-and-forget open -na 'Jira' --args --profile-directory="Profile 2" ''', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
a = ['''exec-and-forget open -na 'Alacritty' ''', 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
q = ['''exec-and-forget open -na 'Google Calendar' --args --profile-directory="datadoghq.com" ''', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
# launch_mode < a : open ~/Applications/Chrome\ Apps.localized/Google\ Calendar.app && osascript -e 'tell application "System Events" to keystroke key code 53'
g = ['''exec-and-forget open -na 'Gmail' --args --profile-directory="datadoghq.com" ''', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
# g = ['''exec-and-forget /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --app="https://mail.google.com/"''', 'move-node-to-workspace 10', 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
# launch_mode < m : /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --app="https://music.youtube.com/" && osascript -e 'tell application "System Events" to keystroke key code 53'
# launch_mode < t : /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --app="https://trello.com/" && osascript -e 'tell application "System Events" to keystroke key code 53'
# # launch_mode < j : /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --app="http://localhost:8888/" && osascript -e 'tell application "System Events" to keystroke key code 53'
# launch_mode < j : /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --app="https://datadoghq.atlassian.net/jira/software/c/projects/RUM/boards/5641" && osascript -e 'tell application "System Events" to keystroke key code 53'
# launch_mode < e : /Applications/Emacs.app/Contents/MacOS/Emacs && osascript -e 'tell application "System Events" to keystroke key code 53'
e = ['''exec-and-forget /Applications/Emacs.app/Contents/MacOS/Emacs''', 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
# launch_mode < shift - e :  /Applications/Emacs.app/Contents/MacOS/bin/emacsclient -c -n -a "" && osascript -e 'tell application "System Events" to keystroke key code 53'
# launch_mode <  s : /Applications/Slack.app/Contents/MacOS/Slack && osascript -e 'tell application "System Events" to keystroke key code 53'
# launch_mode < shift - s : /Applications/Spotify.app/Contents/MacOS/Spotify && osascript -e 'tell application "System Events" to keystroke key code 53'
esc = ['mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', '''exec-and-forget osascript -e 'display notification "Aerospace config reloaded !" with title "Aerospace"' ''', 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
r = ['flatten-workspace-tree', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738'] # reset layout
f = ['layout floating tiling', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

[mode.media.binding]
h = 'exec-and-forget ~/bin/media_control previous'
l = 'exec-and-forget ~/bin/media_control next'
shift-l = 'exec-and-forget ~/bin/media_control next'
shift-h = 'exec-and-forget ~/bin/media_control previous'
j = ["exec-and-forget ~/bin/media_control down", 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
k = ["exec-and-forget ~/bin/media_control up", 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
shift-j = 'exec-and-forget ~/bin/media_control down'
shift-k = 'exec-and-forget ~/bin/media_control up'
space = ["exec-and-forget ~/bin/media_control playpause", 'mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
1 = ['exec-and-forget SwitchAudioSource -s "MacBook Pro Speakers"', 'mode main' , 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
2 = ['exec-and-forget SwitchAudioSource -s "Arctis Nova 7"', 'mode main',  'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
3 = ['exec-and-forget BluetoothConnector -c "ac-bf-71-db-60-2d"', 'exec-and-forget SwitchAudioSource -s "Manu QC45"','mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
4 = ['exec-and-forget SwitchAudioSource -s "Fosi Audio K5 Pro"', 'mode main' , 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']
esc = ['mode main', 'exec-and-forget echo -n "white" | nc -4u -w0 localhost 1738']

[[on-window-detected]]
if.app-name-regex-substring = 'alacritty'
if.window-title-regex-substring = 'Scratchpad'
run = ['layout floating', 'move-node-to-workspace .scratchpad']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'emacs'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.alacritty'
if.window-title-regex-substring = 'Main'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'move-node-to-workspace 1'


[[on-window-detected]]
if.app-name-regex-substring = "Jira"
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace A'

[[on-window-detected]]
if.app-name-regex-substring = 'Youtube Music'
run = 'move-node-to-workspace A'

[[on-window-detected]]
if.app-name-regex-substring = "Google Calendar"
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-name-regex-substring = "Gmail"
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.window-title-regex-substring = "- Manu"
run = 'move-node-to-workspace 10'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['layout floating', 'move-node-to-workspace B']

[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
check-further-callbacks = true
run = 'layout floating'


